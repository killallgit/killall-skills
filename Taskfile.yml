version: "3"

tasks:
  manifests:
    desc: Regenerate the marketplace manifest from the skills
    cmds:
      - uv run --python 3.12 scripts/generate_manifests.py

  tag:patch:
    desc: Test origin/main, bump the patch version, tag it, and push
    cmds:
      - uv run --python 3.12 scripts/release.py patch

  tag:minor:
    desc: Test origin/main, bump the minor version, tag it, and push
    cmds:
      - uv run --python 3.12 scripts/release.py minor

  tag:major:
    desc: Test origin/main, bump the major version, tag it, and push
    cmds:
      - uv run --python 3.12 scripts/release.py major
