version: "3"

env:
  PROOFCAST_SCRIPT: "{{.TASKFILE_DIR}}/scripts/proofcast"

tasks:
  install:
    desc: Link proofcast into ~/.local/bin
    cmds:
      - mkdir -p "$HOME/.local/bin"
      - test ! -e "$HOME/.local/bin/proofcast" || test -L "$HOME/.local/bin/proofcast"
      - ln -sfn "$PROOFCAST_SCRIPT" "$HOME/.local/bin/proofcast"
