<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Factory</title>
<style>
  :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { margin: 2rem; }
  h1 { font-size: 1.25rem; }
  .board { display: grid; grid-template-columns: repeat(5, minmax(10rem, 1fr)); gap: 1rem; }
  .col { background: color-mix(in srgb, Canvas 90%, CanvasText); padding: 0.75rem; border-radius: 8px; }
  h2 { font-size: 0.75rem; letter-spacing: 0.04em; text-transform: uppercase; margin: 0; }
  .card { display: block; width: 100%; text-align: left; background: Canvas; color: CanvasText; border: 0; border-radius: 6px; margin-top: 0.5rem; padding: 0.6rem; cursor: pointer; }
  .needs-human { outline: 2px solid #b45309; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.4rem; }
  .chip { font-size: 0.75rem; padding: 0.1rem 0.4rem; border-radius: 999px; background: color-mix(in srgb, Canvas 80%, CanvasText); }
  .pass { background: #166534; color: white; }
  .changes { background: #9a3412; color: white; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Factory</h1>
<p id="status">Loading board…</p>
<div class="board" id="board"></div>
<article id="detail" hidden><pre id="detail-text"></pre></article>
<script>
const stages = ["spec", "build", "review", "ready", "needs-human"];

function chipClass(verdict) {
  if (verdict === "PASS") return "chip pass";
  if (verdict === "CHANGES") return "chip changes";
  return "chip";
}

async function show(job) {
  const detail = document.querySelector("#detail");
  const out = document.querySelector("#detail-text");
  detail.hidden = false;
  const parts = [`${job.id}`, `branch ${job.branch}`, `round ${job.round ?? 1}`, ""];
  for (const file of ["spec.md", "build.md", "decision.md"]) {
    const res = await fetch(`jobs/${job.id}/${file}`);
    if (res.ok) parts.push(`## ${file}`, "", await res.text(), "");
  }
  out.textContent = parts.join("\n");
}

async function load() {
  const status = document.querySelector("#status");
  try {
    const res = await fetch("board.json", { cache: "no-store" });
    const data = await res.json();
    const board = document.querySelector("#board");
    board.replaceChildren();
    for (const stage of stages) {
      const col = document.createElement("section");
      col.className = "col";
      const title = document.createElement("h2");
      title.textContent = stage;
      col.append(title);
      for (const job of (data.jobs || []).filter((item) => item.stage === stage)) {
        const card = document.createElement("button");
        card.className = "card" + (stage === "needs-human" ? " needs-human" : "");
        card.type = "button";
        const label = document.createElement("div");
        label.textContent = job.id;
        const chips = document.createElement("div");
        chips.className = "chips";
        for (const [lens, verdict] of Object.entries(job.reviews || {})) {
          const chip = document.createElement("span");
          chip.className = chipClass(verdict);
          chip.textContent = `${lens} ${verdict}`;
          chips.append(chip);
        }
        card.append(label, chips);
        card.addEventListener("click", () => show(job));
        col.append(card);
      }
      board.append(col);
    }
    status.textContent = `${(data.jobs || []).length} jobs`;
  } catch (error) {
    status.textContent = `Board unavailable: ${error.message}`;
  }
}

load();
setInterval(load, 2000);
</script>
</body>
</html>
