name: manifests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.12 --with pytest --with pyyaml pytest
      - run: uv run --python 3.12 scripts/generate_manifests.py --check
